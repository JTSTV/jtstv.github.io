name: Auto-Post
on:
  push:
    branches: [ main, master ]

jobs:
  convert_raw_post:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置时区
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo "Asia/Shanghai" | sudo tee /etc/timezone

      - name: 判断跳过标记
        id: skip_check
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if [[ "${MSG}" == *"[SKIP_AUTO_TITLE]"* ]];then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 遍历转换 _posts 下无后缀文件
        if: steps.skip_check.outputs.skip == 'false'
        run: |
          POST_DIR="_posts"
          TODAY=$(date +%Y-%m-%d)
          mkdir -p "${POST_DIR}"
          CHANGED_FILES=()

          echo "====扫描 _posts 目录下文件===="
          while IFS= read -r -d '' filepath; do
            filename=$(basename "${filepath}")
            echo "发现文件: ${filename}"

            # 跳过md文件
            [[ "${filename}" == *.md ]] && continue
            # 跳过已经带日期前缀的文件
            echo "${filename}" | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}-' >/dev/null && continue

            TMP_RAW=$(mktemp /tmp/post.XXXXXX)
            # YAML页面标题：完整原始文件名，转义双引号、替换危险符号
            ESC_TITLE=$(printf "%s" "${filename}" | sed -e 's/"/\\"/g' -e 's/[?*|<>\\]/，/g')
            # 磁盘文件名：截取前70字符，防止255字节超限
            DISK_FILENAME=$(printf "%s" "${filename}" | sed -e 's/[?*|<>\\]/，/g' | cut -c 1-70)
            OUT_MD="${POST_DIR}/${TODAY}-${DISK_FILENAME}.md"

            {
              echo '---'
              echo "title: \"${ESC_TITLE}\""
              echo "date: ${TODAY}"
              echo '---'
              cat "${filepath}"
            } > "${TMP_RAW}"

            rm -f "${filepath}"
            mv "${TMP_RAW}" "${OUT_MD}"
            CHANGED_FILES+=("${OUT_MD}")
            echo "✅输出: ${OUT_MD}"

          done < <(find "${POST_DIR}" -maxdepth 1 -type f -print0)

          echo "一共转换：${#CHANGED_FILES[@]}"
          if [[ ${#CHANGED_FILES[@]} -eq 0 ]];then
            echo "没有需要转换的文件"
            exit 0
          fi

          git config --global user.name "KBot-Auto"
          git config --global user.email "bot@example.com"
          git add "${POST_DIR}/"
          git commit -m "[SKIP_AUTO_TITLE] auto:转换无后缀文章"
          git push origin ${{ github.ref_name }}
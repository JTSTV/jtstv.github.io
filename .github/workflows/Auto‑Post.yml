name: Auto-Post
on:
  push:
    branches: [ main ]

jobs:
  convert_raw_post:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置北京时间
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo "Asia/Shanghai" | sudo tee /etc/timezone

      - name: 判断是否带跳过标记
        id: skip_check
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if [[ "${MSG}" == *"[SKIP_AUTO_TITLE]"* ]];then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 遍历整个_posts文件夹转换
        id: convert_step
        if: steps.skip_check.outputs.skip == 'false'
        run: |
          POST_DIR="_posts"
          TODAY=$(date +%Y-%m-%d)
          CHANGED=0
          mkdir -p "${POST_DIR}"

          echo "开始遍历文件夹 ${POST_DIR}"
          for filepath in "${POST_DIR}"/*; do
            [[ ! -f "${filepath}" ]] && continue
            filename=$(basename "${filepath}")
            echo "扫描文件：${filename}"

            [[ "${filename}" == *.md ]] && continue
            echo "${filename}" | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}-' >/dev/null && continue

            TMP_RAW=$(mktemp /tmp/post.XXXXXX)
            ESC_TITLE=$(printf "%s" "${filename}" | sed 's/"/\\"/g')
            OUT_MD="${POST_DIR}/${TODAY}-${filename}.md"

            {
              echo '---'
              echo "title: \"${ESC_TITLE}\""
              echo "date: ${TODAY}"
              echo '---'
              cat "${filepath}"
            } > "${TMP_RAW}"

            rm -f "${filepath}"
            mv "${TMP_RAW}" "${OUT_MD}"
            CHANGED=1
            echo "✅完成转换：${filename} → ${OUT_MD}"
          done

          echo "CHANGED=${CHANGED}"
          echo "CHANGED=${CHANGED}" >> $GITHUB_ENV

      - name: 提交修改
        if: env.CHANGED == '1'
        uses: ad-m/github-push-action@master
        with:
          branch: main
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message: "[SKIP_AUTO_TITLE] auto:遍历文件夹转换文章"
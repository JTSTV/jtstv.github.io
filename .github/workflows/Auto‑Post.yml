name: Auto-Post
on:
  push:
    branches: [ main ]

jobs:
  convert_raw_post:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置北京时间
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo "Asia/Shanghai" | sudo tee /etc/timezone

      - name: 判断跳过标记
        id: skip_check
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if [[ "${MSG}" == *"[SKIP_AUTO_TITLE]"* ]];then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 处理新增/修改文章｜免日期免md后缀，支持空格中文标点
        if: steps.skip_check.outputs.skip == 'false'
        run: |
          POST_DIR="_posts"
          TODAY=$(date +%Y-%m-%d)
          mkdir -p "${POST_DIR}"
          CHANGED_FILES=()

          # 读取github push事件返回本次变更文件，不再依赖git diff父提交
          while IFS= read -r filepath; do
            [[ -z "${filepath}" ]] && continue
            # 只处理 _posts目录，排除已经是.md后缀
            if [[ ! "${filepath}" =~ ^${POST_DIR}/ ]] || [[ "${filepath}" == *.md ]];then
              continue
            fi

            filename=$(basename "${filepath}")
            echo "检测文件：${filename}"

            TMP_RAW=$(mktemp /tmp/post.XXXXXX)
            ESC_TITLE=$(printf "%s" "${filename}" | sed 's/"/\\"/g')
            OUT_MD="${POST_DIR}/${TODAY}-${filename}.md"

            {
              echo '---'
              echo "title: \"${ESC_TITLE}\""
              echo "date: ${TODAY}"
              echo '---'
              cat "${filepath}"
            } > "${TMP_RAW}"

            rm -f "${filepath}"
            mv "${TMP_RAW}" "${OUT_MD}"
            CHANGED_FILES+=("${OUT_MD}")
            echo "✅处理完成：${filename} → ${OUT_MD}"

          done < <(jq -r '.commits[].added[]?, .commits[].modified[]?' <<< '${{ toJson(github.event) }}' | sort -u)

          echo "本次处理文章数量：${#CHANGED_FILES[@]}"
          if [[ ${#CHANGED_FILES[@]} -eq 0 ]];then
            echo "无需要处理的文件，正常结束"
            exit 0
          fi

          git config --global user.name "KBot"
          git config --global user.email "bot@noreply.github.com"
          git add "${CHANGED_FILES[@]}"
          git commit -m "[SKIP_AUTO_TITLE] auto:转换文章，免md免日期"
          git push origin main
name: Auto-Post
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  convert_raw_post:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置北京时间
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo "Asia/Shanghai" | sudo tee /etc/timezone

      - name: 判断跳过标记
        id: skip_check
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if [[ "${MSG}" == *"[SKIP_AUTO_TITLE]"* ]];then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 仅处理本次提交新增文件
        if: steps.skip_check.outputs.skip == 'false'
        run: |
          POST_DIR="_posts"
          TODAY=$(date +%Y-%m-%d)
          mkdir -p "${POST_DIR}"
          CHANGED_FILES=()

          # 改用github event拿到本次push新增文件，规避HEAD^不存在的问题
          ADDED_FILES=$(jq -r '.commits[].added[]?' <<< '${{ toJson(github.event) }}')
          echo "本次提交新增文件列表："
          echo "${ADDED_FILES}"

          while IFS= read -r filepath; do
            [[ -z "${filepath}" ]] && continue
            if [[ ! "${filepath}" =~ ^${POST_DIR}/ ]];then
              continue
            fi

            filename=$(basename "${filepath}")
            echo "检测新增文件：${filename}"

            [[ "${filename}" == *.md ]] && continue
            echo "${filename}" | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}-' >/dev/null && continue

            TMP_RAW=$(mktemp /tmp/post.XXXXXX)
            ESC_TITLE=$(printf "%s" "${filename}" \
            | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' -e 's/#/\#/g' -e 's/\[/\\[/g' -e 's/\]/\\]/g' -e 's/{/\\{/g' -e 's/}/\\}/g')

            OUT_MD="${POST_DIR}/${TODAY}-${filename}.md"

            {
              echo '---'
              echo "title: \"${ESC_TITLE}\""
              echo "date: ${TODAY}"
              echo '---'
              cat "${filepath}"
            } > "${TMP_RAW}"

            rm -f "${filepath}"
            mv "${TMP_RAW}" "${OUT_MD}"
            CHANGED_FILES+=("${OUT_MD}")
            echo "✅转换完成：${filename} → ${OUT_MD}"

          done <<< "${ADDED_FILES}"

          echo "本次转换文章数：${#CHANGED_FILES[@]}"
          if [[ ${#CHANGED_FILES[@]} -eq 0 ]];then
            echo "没有需要转换的新增文章，退出"
            exit 0
          fi

          git config --global user.name "KBot-Auto"
          git config --global user.email "bot@example.com"
          git add "${POST_DIR}/"
          git commit -m "[SKIP_AUTO_TITLE] auto:文件名生成标题"
          git push origin main
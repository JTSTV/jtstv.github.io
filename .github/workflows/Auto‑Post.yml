name: Auto-Post
on:
  push:
    branches: [ main, master ]

# 并发控制，同分支只跑一个，取消旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convert_raw_post:
    runs-on: ubuntu-latest
    # 跳过 bot 自己产生的提交，杜绝循环触发红叉
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置时区
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo "Asia/Shanghai" | sudo tee /etc/timezone

      - name: 遍历转换 _posts 下无后缀文件
        run: |
          POST_DIR="_posts"
          TODAY=$(date +%Y-%m-%d)
          mkdir -p "${POST_DIR}"
          CHANGED_FILES=()

          echo "====扫描 _posts 目录===="
          while IFS= read -r -d '' filepath; do
            filename=$(basename "${filepath}")
            echo "检测源文件: ${filename}"

            # 跳过 .md 文件
            [[ "${filename}" == *.md ]] && continue
            # 跳过已经带日期前缀的文件
            echo "${filename}" | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}-' >/dev/null && continue

            # 磁盘立刻重命名源文件，消除危险符号 ? ! * | < > \
            SAFE_SRC_NAME=$(printf "%s" "${filename}" | sed -e 's/[?!*|<>\\]/，/g')
            SAFE_SRC_PATH="${POST_DIR}/${SAFE_SRC_NAME}"
            mv -- "${filepath}" "${SAFE_SRC_PATH}"

            TMP_RAW=$(mktemp /tmp/post.XXXXXX)
            # YAML title保留用户完整原始标题
            ESC_TITLE=$(printf "%s" "${filename}" | sed -e 's/"/\\"/g' -e 's/[?*|<>\\]/，/g')
            # 输出md磁盘文件名截断70字符，规避255字节限制
            DISK_OUT_NAME=$(printf "%s" "${SAFE_SRC_NAME}" | cut -c 1-70)
            OUT_MD="${POST_DIR}/${TODAY}-${DISK_OUT_NAME}.md"

            {
              echo '---'
              echo "title: \"${ESC_TITLE}\""
              echo "date: ${TODAY}"
              echo '---'
              cat "${SAFE_SRC_PATH}"
            } > "${TMP_RAW}"

            rm -f -- "${SAFE_SRC_PATH}"
            mv -- "${TMP_RAW}" "${OUT_MD}"
            CHANGED_FILES+=("${OUT_MD}")
            echo "✅生成: ${OUT_MD}"

          done < <(find "${POST_DIR}" -maxdepth 1 -type f -print0)

          echo "修改文件数量：${#CHANGED_FILES[@]}"
          if [[ ${#CHANGED_FILES[@]} -eq 0 ]];then
            echo "无待转换文件，正常结束"
            exit 0
          fi

          git config --global user.name "KBot-Auto"
          git config --global user.email "bot@example.com"
          git add "${POST_DIR}/"
          git commit -m "[SKIP_AUTO_TITLE] auto:转换无后缀文章"
          git push origin ${{ github.ref }}
name: Auto-Post
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  convert_raw_post:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置北京时间
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo "Asia/Shanghai" | sudo tee /etc/timezone

      - name: 判断是否跳过本次转换
        id: skip_check
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if [[ "${MSG}" == *"[SKIP_AUTO_TITLE]"* ]];then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 转换无后缀文章
        if: steps.skip_check.outputs.skip == 'false'
        run: |
          POST_DIR="_posts"
          TODAY=$(date +%Y-%m-%d)
          mkdir -p "${POST_DIR}"
          CHANGED=()

          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            [[ ! "$f" =~ ^${POST_DIR}/ ]] && continue
            [[ "$f" == *.md ]] && continue
            [[ ! -f "$f" ]] && continue

            fn=$(basename "$f")
            echo "处理文件：$fn"
            tmp=$(mktemp)
            title_esc=$(printf "%s" "$fn" | sed 's/"/\\"/g')
            out="${POST_DIR}/${TODAY}-${fn}.md"

            cat > "$tmp" <<EOF
---
title: "${title_esc}"
date: ${TODAY}
---
$(cat "$f")
EOF
            rm -f "$f"
            mv "$tmp" "$out"
            CHANGED+=("$out")
          done < <(jq -r '.commits[].added[]?, .commits[].modified[]?' <<< '${{ toJson(github.event) }}' | sort -u)

          echo "处理数量：${#CHANGED[@]}"
          if [[ ${#CHANGED[@]} -eq 0 ]];then
            echo "无待处理文件，正常退出"
            exit 0
          fi

          git config --global user.name "KBot"
          git config --global user.email "bot@noreply.github.com"
          git add "${CHANGED[@]}"
          git commit -m "[SKIP_AUTO_TITLE] auto convert post"
          git push origin main
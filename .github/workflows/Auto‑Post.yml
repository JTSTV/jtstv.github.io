name: Auto-Post
on:
  push:
    branches: [ main ]

jobs:
  convert_raw_post:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取完整代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: 设置北京时间
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo "Asia/Shanghai" | sudo tee /etc/timezone

      - name: 判断是否本提交已经带SKIP标记
        id: skip_check
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if [[ "${MSG}" == *"[SKIP_AUTO_TITLE]"* ]];then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "检测到SKIP标记，直接跳过"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 处理App新建的无后缀文章
        if: steps.skip_check.outputs.skip == 'false'
        run: |
          POST_DIR="_posts"
          TODAY=$(date +%Y-%m-%d)
          CHANGED=0
          mkdir -p "${POST_DIR}"

          # 只拿本次commit新增的文件，不遍历整个文件夹！关键！
          ADDED_FILES=$(git diff --name-only --diff-filter=A HEAD^ HEAD)

          while IFS= read -r filepath; do
            [[ -z "${filepath}" ]] && continue
            # 只处理 _posts/ 下面的文件
            if [[ ! "${filepath}" =~ ^${POST_DIR}/ ]];then
              continue
            fi

            filename=$(basename "${filepath}")
            # 跳过md文件、跳过已经日期开头文件
            [[ "${filename}" == *.md ]] && continue
            echo "${filename}" | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}-' >/dev/null && continue

            TMP_RAW=$(mktemp /tmp/post.XXXXXX)
            ESC_TITLE=$(printf "%s" "${filename}" | sed 's/"/\\"/g')
            OUT_MD="${POST_DIR}/${TODAY}-${filename}.md"

            {
              echo '---'
              echo "title: \"${ESC_TITLE}\""
              echo "date: ${TODAY}"
              echo '---'
              cat "${filepath}"
            } > "${TMP_RAW}"

            rm -f "${filepath}"
            mv "${TMP_RAW}" "${OUT_MD}"
            CHANGED=1

          done <<< "${ADDED_FILES}"

          if [[ ${CHANGED} -eq 0 ]];then
            echo "✅本次没有需要转换的文章"
            exit 0
          fi

          git config user.name "KBot‑Auto"
          git config user.email "bot@local"
          git add "${POST_DIR}/"
          git commit -m "[SKIP_AUTO_TITLE] auto:文件名生成标题"

          # 原生git push，不依赖第三方action
          git remote set-url origin https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin main